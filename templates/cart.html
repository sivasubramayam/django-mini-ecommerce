{% extends "base.html" %}

{% block content %}

<h2>Shopping Cart</h2>

<table class="table">
    <tr>
        <th>Product</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Total</th>
    </tr>

    {% for item in cart_items %}
    <tr>
        <td>{{ item.product.name }}</td>
        <td>₹{{ item.product.price }}</td>
        <td>{{ item.quantity }}</td>
        <td>₹{{ item.total_price }}</td>
    </tr>
     <td>
        <a href="{% url 'remove_cart' item.id %}"
        class="btn btn-danger btn-sm">
        Remove
        </a>
    </td>
    <a href="{% url 'place_order' %}" class="btn btn-success">
        Place Order
    </a>
    {% endfor %}
   
</table>

<h3 class="text-end">
    Grand Total : ₹{{ total }}
</h3>

{% endblock %}
