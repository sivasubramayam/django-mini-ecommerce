{% extends "base.html" %}

{% block content %}

<h2>My Orders</h2>

<table class="table">

<tr>
<th>Product</th>
<th>Quantity</th>
<th>Total</th>
<th>Status</th>
</tr>

{% for order in orders %}

<tr>

<td>{{order.product.name}}</td>
<td>{{order.quantity}}</td>
<td>₹{{order.total_price}}</td>
<td>{{order.status}}</td>

</tr>

{% endfor %}

</table>

{% endblock %}
